events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Rate limit: max 15 requests per seconde per IP, met een burst van 30
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;

    # Splendor Backend API
    server {
        listen 80;
        server_name splendor-api.velleb.com;

        location / {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://splendor-server:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Skynet (.NET 8 Backend API)
    server {
        listen 80;
        server_name skynet-api.velleb.com;

        location / {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://skynet-server:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}