services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - default
      - skynet_net
    depends_on:
      - splendor-server
      - skynet-server
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  splendor-server:
    build:
      context: ./semester-2/programming-project/server
      dockerfile: Dockerfile
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  skynet-server:
    build:
      context: ./semester-3/analysis-and-development-project/server
      dockerfile: config/docker/Dockerfile
    restart: unless-stopped
    env_file:
      - .skynet.env
    networks:
      - skynet_net
    depends_on:
      skynet-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  skynet-db:
    image: mysql:8.0
    restart: unless-stopped
    env_file:
      - .skynet.env
    command: --innodb-buffer-pool-size=128M --performance-schema=OFF
    volumes:
      - skynet_mysql_data:/var/lib/mysql
    networks:
      skynet_net:
        aliases:
          - db
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  skynet_net:

volumes:
  skynet_mysql_data: