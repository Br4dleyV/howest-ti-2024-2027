services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - splendor-server
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M

  splendor-server:
    build:
      context: ./semester-2/programming-project/server
      dockerfile: Dockerfile
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M