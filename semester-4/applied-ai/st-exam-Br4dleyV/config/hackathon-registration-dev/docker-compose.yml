services:
  hackathon-registration:
    image: hcr.technet.howest.be/hackathon-registration:latest
    ports:
      - 40520:8000
    env_file:
      - .hackathon-registration.env
    networks:
      - hackathon-registration-assistant
    depends_on:
      hackathon-registration-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  hackathon-registration-db:
    image: postgres
    ports:
      - 40521:5000
    volumes:
      - postgres:/data/postgres-hackathon-registration
    env_file:
      .hackathon-registration-db.env
    networks:
      - hackathon-registration-assistant
    healthcheck:
      test: pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || exit 1
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s

networks:
  hackathon-registration-assistant:
    ipam:
      config:
        - subnet: 10.31.0.0/16

volumes:
  postgres:

