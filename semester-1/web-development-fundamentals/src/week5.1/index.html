<!DOCTYPE html>
<html lang="en">
<head>
    <title>Make-a-wishlist for Santa!</title>
    <link rel="stylesheet" href="assets/css/reset.css" type="text/css">
    <link rel="stylesheet" href="assets/css/screen.css" type="text/css">
    <meta name="author" content="Bradley Velle">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
</head>
<body>

<h1>Make-a-wishlist for Santa!</h1>

<main>
    <form method="POST" action="https://jkorpela.fi/cgi-bin/echo.cgi">
        <fieldset>
            <legend>Some information about you</legend>

            <label for="name">Who are you?</label>
            <input type="text" name="name" id="name">

            <label for="email">Where shall we mail your pending approval to?</label>
            <input type="email" name="email" id="email" placeholder="someone@somewhere.com" required>

            <label for="telephone">Can E.T. phone home?</label>
            <input type="tel" name="telephone" id="telephone">

            <label for="planet">Where are you from?</label>
            <select id="planet" name="planet">
                <option value="earth">Earth</option>
                <option value="venus">Venus</option>
                <option value="mars">Mars</option>
            </select>
        </fieldset>

        <fieldset>
            <legend>Something to please Santa</legend>

            <label for="elves">Which do you like better: the elves or the reindeer?</label>
            <input type="radio" name="likes-better" id="elves" value="elves">
            <label for="elves">Elves</label>
            <input type="radio" name="likes-better" id="reindeer" value="reindeer">
            <label for="reindeer">Reindeer</label>

            <label for="balls">What do you usually decorate your x-mas tree with?</label>
            <input type="checkbox" name="balls" id="balls" value="balls"><label for="balls">Balls</label>
            <input type="checkbox" name="lights" id="lights" value="lights" ><label for="lights">Lights</label>
            <input type="checkbox" name="snow" id="snow" value="snow" ><label for="snow">Snow</label>
            <input type="checkbox" name="little-men" id="little-men" value="little-men"><label for="little-men">Little men</label>
            <input type="checkbox" name="fireworks" id="fireworks" value="fireworks"><label for="fireworks">Fireworks!</label>

            <label for="favourite-xmas-movie">What is your favourite x-mas movie?</label>
            <select id="favourite-xmas-movie" name="favourite-xmas-movie" required>
                <option value="nightmare-before-christmas">Nightmare before Christmas</option>
                <option value="labyrinth">Labyrinth</option>
                <option value="edward-scissorhands">Edward Scissorhands</option>
                <option value="the-expendables">The expendables! What else?</option>
                <option value="i-hate-christmas-movies">I absolutely hate Christmas movies</option>
                <option value="other">Other (please specify)</option>
            </select>

            <label for="number-of-trees-owned">How many x-mas trees do you own?</label>
            <input type="number" name="number-of-trees-owned" id="number-of-trees-owned">
        </fieldset>

        <fieldset>
            <legend>At last... your request</legend>
            <label for="request">So, what will it be?</label>
            <textarea rows="5" id="request" name="request" required></textarea>
        </fieldset>

        <button>Send to Santa!</button>
    </form>
</main>

</body>
</html>
